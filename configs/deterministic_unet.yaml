data:
  cache_dir: dataset/mario-1-1-120x128
  history: 4
  batch_size: 64
  validation_batch_size: 64
  workers: 16
  prefetch_factor: 4
model:
  n_actions: 7
  base_channels: 64
  channel_multipliers: [1, 2, 3, 4]
  blocks_per_level: 2
  action_embed_dim: 64
  condition_dim: 256
optimizer:
  learning_rate: 0.0002
  weight_decay: 0.0001
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 2000
  gradient_clip: 1.0
runtime:
  output_dir: runs/deterministic-unet
  seed: 42
  epochs: 30
  device: cuda
  compile: true
  use_bfloat16: true
  use_tf32: true
  channels_last: true
  ema_decay: 0.999
  validation_every_epochs: 1
  rollout_horizon: 16
